[package]
name = "vtubecord"
version = "0.1.0"
description = "Vtubecord desktop application"
authors = ["Vtubecord"]
edition = "2021"

[lib]
name = "vtubecord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Vtubecord"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
